<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PWWE – Merci de votre visite</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="assets/icone.png">
<link rel="apple-touch-icon" href="assets/icone.png">
<link rel="stylesheet" href="assets/style.css">
<style>
  body { min-height: 100vh; min-height: 100dvh; }
  main {
    max-width: 30rem; margin: 0 auto;
    padding: calc(1rem + env(safe-area-inset-top, 0px)) 1.25rem calc(2rem + env(safe-area-inset-bottom, 0px));
  }
  .tete img { display: block; width: 5.5rem; height: auto; margin-left: -.35rem; }
  h1 {
    font-family: var(--titre); font-weight: 900; color: var(--canne);
    font-size: clamp(2.2rem, 10vw, 3rem); line-height: 1.04; letter-spacing: .005em; margin: 1.1rem 0 0; text-wrap: balance;
  }
  p { font-size: 1.125rem; line-height: 1.45; margin: 1rem 0 0; }
  .insta {
    display: block; margin-top: 1.75rem; padding: 1rem 1.25rem; border-radius: 8px;
    background: var(--ciel-profond); color: #fff; text-decoration: none; text-align: center;
    font-family: var(--titre); font-weight: 900; font-size: 1.5rem; line-height: 1.1;
  }
  .insta:focus-visible { outline: 3px solid var(--canne); outline-offset: 3px; }
  .slogan { margin-top: 2.5rem; font-family: var(--titre); font-weight: 400; font-size: 1.25rem; color: var(--canne); }
</style>
</head>
<body>
<main>
  <header class="tete"><img src="assets/logo-pwwe.png" alt="Pa Wol Wonm Expérience" width="485" height="520"></header>
  <h1>Merci de votre visite</h1>
  <p>Le stand PWWE de la Fête de la Canne 2026 est terminé : le nuage de mots et la liste des ateliers sont fermés.</p>
  <p>Les dates de nos prochains ateliers sont annoncées sur Instagram.</p>
  <a class="insta" id="insta" href="https://www.instagram.com/pwwe972" rel="noopener">Suivre PWWE sur Instagram</a>
  <p class="slogan">L’excellence à la portée de vos sens</p>
</main>
<script src="config.js"></script>
<script>
  (function () { var C = window.PWWE || {}; if (C.INSTAGRAM) document.getElementById("insta").href = C.INSTAGRAM; })();
</script>
</body>
</html>
